name: Build

# The skeleton builds and its tests pass (#29): `make lint` and `make test`,
# on the oldest supported distribution's toolchain (docs/install.md). A
# required check, `build` (`[settings] required_checks` in
# .github/org-sync.toml, #34), so no `paths:` filter.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

# A newer push to the same pull request cancels this run (swarm-routing/.github#505).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        timeout-minutes: 2  # its download and start take seconds (swarm-routing/.github#164)
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain
        timeout-minutes: 5
        run: |
          ok=
          for i in 1 2 3; do
            if sudo apt-get update --error-on=any; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ -n "$ok" ] || { echo "::error::apt-get update failed three times (an Ubuntu mirror outage?)"; exit 1; }
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
      # swarm-core from its vcpkg port (#31, swarm-routing/.github#489): the tool at
      # the org's pinned commit; sets VCPKG_ROOT, which `make test` reads.
      - name: vcpkg
        uses: swarm-routing/.github/.github/actions/setup-vcpkg@8edfe584baaffbbb22c45366fb0399352488fa5c # main@2026-11-26
        timeout-minutes: 8
        with:
          # one small port; the NuGet cache's mono install costs more than it saves
          # (measured in swarm-routing/ARA's core.yml, swarm-routing/.github#489)
          binary-cache: 'off'
      - name: Lint
        timeout-minutes: 2
        run: make lint
      - name: Build and test
        timeout-minutes: 5
        env:
          CMAKE_GENERATOR: Ninja
        run: make test
