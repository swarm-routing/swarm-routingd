name: Licence

# The whole repository is MIT OR GPL-2.0-only (LICENSING.md). The input cannot
# name the root, so each top-level source directory is named in dual-roots as
# it is added (src/ and test/, the skeleton of #29); every file elsewhere
# still needs its SPDX line.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@445701b058287671acb47c9c42791b5902f07da7 # main@2026-11-25
    with:
      dual-roots: 'src/ test/'
      core-roots: ''
