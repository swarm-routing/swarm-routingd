name: swarm-core

# `swarm-core / pin` (swarm-routing/.github#958): swarm-core.lock, the
# vcpkg.json override and the vcpkg-configuration.json registry baseline name
# one swarm-core release, and the lock verifies against it (AGENTS.md
# "Dependencies"). Not org-managed: the caller of
# swarm-routing/.github reusable-swarm-core-pin.yml. Runs on every PR (no
# `paths:` filter), so it can be a required check.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  swarm-core:
    uses: swarm-routing/.github/.github/workflows/reusable-swarm-core-pin.yml@8edfe584baaffbbb22c45366fb0399352488fa5c # main@2026-11-26
