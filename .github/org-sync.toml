# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "c-cpp"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#765)
bestpractices_project = "17077"
title = "swarm-routingd"
dual = [""]
# The org's `dependencies` section describes a protocol's core/ and ns-3 build; the daemon has
# neither (swarm-core through vcpkg at the root, no ns-3), so AGENTS.md keeps its own (#31).
skip = ["AGENTS.md#dependencies"]
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
posture = "a research routing daemon for Linux testbeds and emulators, pre-release (no version cut yet)"
trust_boundary = """
Untrusted input, once the daemon exists (epic #3): every datagram on its UDP
control socket, every packet the kernel hands it on the `swarm0` TUN device,
and the netlink replies it reads. The only code that parses a control
message is the protocol core's bounds-checked little-endian reader (org
invariant 3), at the swarm-core release the build pins; the daemon copies
bytes into it and never interprets them. Today the repository holds a
skeleton that parses only its own command line. The full threat model, with
the capabilities the daemon holds and why: [docs/threat-model.md](docs/threat-model.md)."""
limitations = """
- No authentication or integrity on control messages: any host on the
  routing interface can inject routes, as in the protocols' papers. Run it
  only on testbeds, emulators and networks you control.
- It needs `CAP_NET_ADMIN` (routes, TUN). It is meant to run with that one
  capability and nothing else (docs/threat-model.md); running it as root is
  the operator's choice and outside what it promises.
- Pre-release: nothing is built beyond a skeleton; no release exists yet."""
verifying = """
No release exists yet. Releases will be built, signed and published by the
org's release workflow (`swarm-routing/.github` `reusable-release.yml`,
called by `.github/workflows/release.yml`): the source tarball
`swarm-routingd-X.Y.Z.tar.gz` (`make dist`), `SHA256SUMS`, a CycloneDX SBOM
and signed SLSA build provenance; the release notes carry the
`sha256sum -c` and `gh attestation verify` commands."""

[docs]
arena_id = "swarm-routingd"  # its id in swarm-routing.github.io site/hub/projects.json (swarm-routing/swarm-routing.github.io#312)

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "swarm-routingd, the Linux userspace routing daemon that runs swarm-routing protocol cores over real sockets, netlink routes and a TUN device: a single-threaded epoll reactor on swarm-core's ports, for testbeds, CORE/EMANE and Shadow (planned)."
homepage = "https://swarm-routing.github.io/projects/swarm-routingd/"
topics = ["linux", "routing-daemon", "netlink", "manet", "swarm-intelligence", "routing-protocol", "cpp23", "emane", "shadow"]
ruleset = "protocol"
# Only checks that run on every PR today. Add the build and test checks (core, ns-3, ...)
# once their workflows exist and run on pull_request and merge_group.
# build: build.yml's job (`make lint`, `make test`), green on main since #30 (#34); a plain job,
# so its check run is `build`, not `build / build`.
required_checks = ["check / org-sync", "headers / licence", "title / title", "review / coderabbit", "build"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
